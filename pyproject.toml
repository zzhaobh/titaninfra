# -------------------------------
# build-system
# -------------------------------
[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

# -------------------------------
# project (PEP 621 metadata)
# -------------------------------
[project]
name = "titaninfra"
version = "1.1.0"
description = "A full-stack LM development framework with elastic data pipelines and unified Pretrain, SFT, and CPT"
readme = {file = "README.md", content-type = "text/markdown"}
license = "BSD-3-Clause"
requires-python = ">=3.10"

authors = [
    {name = "TitanInfra Contributors", email = "zzhaobh@connect.ust.hk"}
]

keywords = [
    "machine-learning",
    "deep-learning",
    "training",
    "llm",
    "rlhf",
    "sft",
    "torchtitan"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies (minimal, no heavy ML frameworks)
dependencies = [
    "torch>=2.15.0,<2.16.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "tensordict>=0.3.0",
    "numpy>=1.24.0",
    # Required by top-level imports; missing packages break `import titaninfra`.
    "msgspec>=0.18.0",   # data/schema.py, data/validator.py, data/sft/normalize.py
    "pydantic>=2.0.0",   # config/{data,model,train}.py and data/schema.py (v2 validators)
    "psutil>=5.9.0",     # models/qwen3/state_dict_adapter.py
    "pillow>=10.0.0",    # data/image_loader.py
]

[project.optional-dependencies]
# Data processing
data = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "datasets>=2.14.0",
    "transformers>=5.10.0",
    "torchdata>=0.11.0",
]

# Ray data conversion (lightweight: no torch/torchtitan)
ray-data = [
    "transformers>=5.10.0",
    "pyarrow>=24.0.0",
    "msgspec>=0.21.0",
    "pydantic>=2.13.0",
    "psutil>=5.9.0",
    "ray>=2.55.0",
]

# OSS/S3 cloud storage
oss = [
    "boto3>=1.26.0",
]

# Full data and cloud-storage installation (TorchTitan is installed separately)
all = [
    "titaninfra[data,oss]",
]

# Profiling & trace analysis
profiling = [
    "HolisticTraceAnalysis>=0.2.0",
]

# Development tools
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "black>=23.0",
    "isort>=5.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

# Documentation
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/zzhaobh/titaninfra"
Repository = "https://github.com/zzhaobh/titaninfra"
Issues = "https://github.com/zzhaobh/titaninfra/issues"

# -------------------------------
# tool.ruff - Linting configuration
# -------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "I",      # isort
    "G",      # flake8-logging-format
]
ignore = [
    "F405",   # star imports
    "F403",   # undefined local with import *
    "E731",   # lambda expression assignment
    "B007",   # Loop control variable not used
    "UP032",  # f-string format
    "G004",   # logging f-string
]

[tool.ruff.lint.isort]
known-first-party = ["titaninfra"]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests have legitimate long-line dumps, late imports after
# sys.path manipulation, and one-line conditional clauses. Production
# code in titaninfra/ stays strict.
"scripts/**" = ["E402", "E501", "E701"]
"tests/fixtures/**" = ["E402", "E501", "E701", "E722"]
"tests/**" = ["E501"]

# -------------------------------
# tool.mypy - Type checking config
# -------------------------------
[tool.mypy]
python_version = "3.9"
pretty = true
ignore_missing_imports = true
explicit_package_bases = true
follow_imports = "skip"
warn_return_any = false
warn_unused_configs = true

# -------------------------------
# tool.pytest - Test configuration
# -------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -n 2 --dist=loadgroup"
markers = [
    "roundtrip: HF <-> DCP checkpoint roundtrip tests (requires torch + torchtitan)",
    "xdist_group: pin tests sharing the same group name to one xdist worker (serialized)",
]

# -------------------------------
# tool.coverage - Coverage config
# -------------------------------
[tool.coverage.run]
source = ["titaninfra"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# -------------------------------
# tool.setuptools - Package config
# -------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["titaninfra*"]
exclude = ["tests*", "venv*"]

[tool.setuptools.package-data]
titaninfra = []

# -------------------------------
# tool.black - Code formatting
# -------------------------------
[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]

# -------------------------------
# tool.isort - Import sorting
# -------------------------------
[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["titaninfra"]
